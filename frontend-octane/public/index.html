<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native Text Editor</title>
  </head>
  <body>
    <div id="root">
      <main class="editor-app">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark">N</span>
            <span class="brand-name">Plaintext</span>
          </div>
          <div class="document-title" aria-live="polite">untitled.txt</div>
          <div class="top-actions">
            <button class="toolbar-button subtle" id="new-document" type="button">New</button>
            <button class="toolbar-button subtle" id="copy-result" type="button">Copy</button>
            <button class="toolbar-button subtle" id="export-history" type="button">Export</button>
            <button class="toolbar-button primary" id="calculate" type="button">Run metrics</button>
          </div>
        </header>

        <div class="editor-layout">
          <section class="editor-pane" aria-label="Text editor">
            <div class="editor-meta">
              <span>INPUT</span>
              <span id="cursor-position">Line 1, Col 1</span>
            </div>
            <label class="sr-only" for="values">Document text</label>
            <textarea id="values" spellcheck="false" aria-describedby="editor-help">12.5, 15, 8.5, 14</textarea>
            <div class="editor-footer">
              <span id="editor-help">Comma-separated numbers are sent to the native C engine.</span>
              <span id="document-status">Ready</span>
            </div>
          </section>

          <aside class="right-toolbar" aria-label="Editor tools">
            <button class="rail-button active" id="tool-edit" type="button" aria-label="Edit document" title="Edit document"><span aria-hidden="true">✎</span></button>
            <button class="rail-button" id="tool-run" type="button" aria-label="Run metrics" title="Run metrics"><span aria-hidden="true">▶</span></button>
            <button class="rail-button" id="tool-clear" type="button" aria-label="Clear document" title="Clear document"><span aria-hidden="true">⌫</span></button>
            <div class="rail-spacer"></div>
            <button class="rail-button" id="tool-info" type="button" aria-label="Show help" title="Show help"><span aria-hidden="true">?</span></button>
          </aside>
        </div>

        <section id="result" class="result-panel" aria-live="polite" aria-label="Metrics result">
          <div class="result-heading"><span>OUTPUT</span><span id="result-status">No result yet</span></div>
          <p class="placeholder">Run metrics to inspect the native calculation.</p>
        </section>
      </main>
    </div>
  </body>
</html>
